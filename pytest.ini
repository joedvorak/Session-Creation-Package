[pytest]
# SMART Session Organizer Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use files/databases)
    slow: Slow tests (embedding generation, full workflows)
    requires_ollama: Tests requiring Ollama server
    requires_gemini: Tests requiring Gemini API key

# Ignore patterns
norecursedirs = 
    .git
    __pycache__
    legacy
    *.egg-info

# Minimum version
minversion = 7.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
